<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:I;font-weight:500;src:url(file:///usr/share/fonts/opentype/inter/Inter-Medium.otf)}
@font-face{font-family:I;font-weight:700;src:url(file:///usr/share/fonts/opentype/inter/Inter-Bold.otf)}
@font-face{font-family:I;font-weight:800;src:url(file:///usr/share/fonts/opentype/inter/Inter-ExtraBold.otf)}
@font-face{font-family:D;font-weight:800;src:url(file:///usr/share/fonts/opentype/inter/InterDisplay-Bold.otf)}
html,body{margin:0;width:1080px;height:1920px;overflow:hidden;background:#050B1C}
canvas{display:block}
</style>
<script src="node_modules/d3-array/dist/d3-array.min.js"></script>
<script src="node_modules/d3-geo/dist/d3-geo.min.js"></script>
<script src="node_modules/topojson-client/dist/topojson-client.min.js"></script>
</head><body><canvas id="c" width="1080" height="1920"></canvas>
<script>
// ================= TIMELINE (video seconds; voiceover starts at 1.0 s) =================
const T={DUR:40,
  hook:1.0, fever:2.4, drench:3.8, pacific:5.3,
  normal:6.6, wind:7.2, pool:8.4, upwell:9.8,
  weaken:11.8, slosh:13.0, stop:14.3, loop:999, nino:15.5,
  heatAir:999, spike:16.8, amer:18.6, dryAus:19.9,
  runout:21.8, surge:23.2, strong:24.4, nina:25.6,
  ninaFlood:27.2, ninaDry:29.0,
  cycle:31.2, cycleText:33.6,
  pend:999, pendEnd:999};
const COL={ink:'#F6F3EC',muted:'#9AA8C4',yellow:'#FFD233',warm:'#FF6A2A',red:'#E8341C',cool:'#3D8BFF',ice:'#8FD3FF',navy:'#0A1530'};

// ================= helpers =================
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x)), lerp=(a,b,k)=>a+(b-a)*k;
const P=(t,a,d)=>clamp((t-a)/d);
const eo=k=>1-Math.pow(1-k,3), eio=k=>k<.5?4*k*k*k:1-Math.pow(-2*k+2,3)/2;
const back=k=>{const c=1.6;return 1+(c+1)*Math.pow(k-1,3)+c*Math.pow(k-1,2)};
const ss=(a,b,x)=>{const k=clamp((x-a)/(b-a));return k*k*(3-2*k)};
const D2R=Math.PI/180;
function hex(h){return [1,3,5].map(i=>parseInt(h.substr(i,2),16))}
function mix(a,b,k){const A=hex(a),B=hex(b);return 'rgb('+A.map((v,i)=>Math.round(lerp(v,B[i],k))).join(',')+')'}
// 3D value noise (seamless on the sphere)
function h3(x,y,z){let n=Math.sin(x*127.1+y*311.7+z*74.7)*43758.5453;return n-Math.floor(n)}
function vnoise(x,y,z){const xi=Math.floor(x),yi=Math.floor(y),zi=Math.floor(z),xf=x-xi,yf=y-yi,zf=z-zi;
  const u=xf*xf*(3-2*xf),v=yf*yf*(3-2*yf),w=zf*zf*(3-2*zf);let r=0;
  for(let dx=0;dx<2;dx++)for(let dy=0;dy<2;dy++)for(let dz=0;dz<2;dz++){
    r+=h3(xi+dx,yi+dy,zi+dz)*(dx?u:1-u)*(dy?v:1-v)*(dz?w:1-w);}return r}
function fbm(x,y,z){return vnoise(x,y,z)*.55+vnoise(x*2.1,y*2.1,z*2.1)*.3+vnoise(x*4.3,y*4.3,z*4.3)*.15}
const rnd=i=>{const x=Math.sin(i*91.17+3.3)*43758.5453;return x-Math.floor(x)};

// ================= data =================
let LAND=null, INDO=null, GRAT=d3.geoGraticule10();
async function loadData(){
  const land=await (await fetch('node_modules/world-atlas/land-50m.json')).json();
  const ctry=await (await fetch('node_modules/world-atlas/countries-50m.json')).json();
  LAND=topojson.feature(land,land.objects.land);
  INDO=topojson.feature(ctry,ctry.objects.countries).features.find(f=>f.id==='360');
}

// ================= ocean state =================
// L = longitude measured eastward 0..360 (Indonesia ≈118, dateline 180, Peru coast ≈ 280)
function state(t){
  const s={};
  s.poolOn=eo(P(t,T.pool,1.6));
  s.windOn=eo(P(t,T.wind,1));
  const kd=eio(P(t,T.slosh,3)), kr=eio(P(t,T.runout,2.2)), ks=eio(P(t,T.surge,2.4));
  // warm water: west (normal) -> spread east (El Niño) -> fades (heat released) -> back west (La Niña)
  s.Lc=lerp(lerp(150,236,kd),140,ks);
  s.wid=lerp(lerp(38,72,kd),38,ks);
  s.amp=lerp(lerp(.8,1.1,kd),.95,ks)*lerp(1,.2,kr*(1-ks));
  // cold upwelling off South America: normal on, El Niño off, La Niña strong + tongue westward
  s.upwell=eo(P(t,T.upwell,1.2))*(1-eio(P(t,T.stop,1.6))) + ks*1.2;
  s.cold=ks;
  s.wind=lerp(lerp(1,.15,eio(P(t,T.weaken-.2,1.6))),1.8,eio(P(t,T.strong,1.6)));
  s.loopFx=eo(P(t,T.loop,.8))*(1-eo(P(t,T.nino,.6)));
  // convection follows warm water
  const kc=eio(P(t,T.slosh+1,2.6));
  s.cL=lerp(lerp(140,232,kc),130,eio(P(t,T.surge+.4,2.6)));
  s.cAmp=eo(P(t,T.pool+.6,1.4))*lerp(1,1.4,eio(P(t,T.ninaFlood,1.4)));
  s.cDark=lerp(0,.5,eio(P(t,T.ninaFlood,1.6)));
  s.rain=0; s.evap=0;
  // global heat (hook fever + El Niño spike)
  s.heatGlobe=Math.max(eio(P(t,T.fever-.4,.8))*(1-eio(P(t,T.drench-.4,.8))), eio(P(t,T.spike-.4,1.2))*(1-eio(P(t,T.amer,1.2)))*.9);
  s.hookRain=eio(P(t,T.drench-.4,.8))*(1-eio(P(t,T.pacific+.6,1)));
  s.dry=0; s.wet=0; s.fire=0; s.hookFire=0;
  // closing: oscillate El Niño <-> La Niña
  const kcy=eio(P(t,T.cycle,1.2));
  if(kcy>0){const ph=eio(P(t,T.cycle,1.6));
    s.Lc=lerp(s.Lc,lerp(140,236,ph),kcy); s.wid=lerp(s.wid,lerp(38,70,ph),kcy); s.amp=lerp(s.amp,1,kcy);
    s.cold=lerp(s.cold,1-ph,kcy); s.upwell=lerp(s.upwell,(1-ph)*1.2,kcy);
    s.cL=lerp(s.cL,lerp(130,232,ph),kcy); s.cAmp=lerp(s.cAmp,1.1,kcy); s.cDark=lerp(s.cDark,.2,kcy);
    s.wind=lerp(s.wind,lerp(1.6,.3,ph),kcy);}
  return s;
}

// ================= camera =================
// keyframes: [time, centerLon, centerLat, radius, centerY]
const CAMK=[
  [0,-185,8,540,1130],[T.pacific,-165,4,540,1130],[T.normal,-160,2,540,1130],
  [T.amer-.8,-160,2,540,1130],[T.amer+.4,-88,-4,540,1130],[T.dryAus-.2,-88,-4,540,1130],
  [T.dryAus+.8,128,-18,540,1130],[T.runout-.3,128,-18,540,1130],[T.runout+.8,-160,2,540,1130],
  [T.ninaFlood-.5,-160,2,540,1130],[T.ninaFlood+.5,128,-18,540,1130],[T.ninaDry-.3,128,-18,540,1130],
  [T.ninaDry+.8,-100,22,520,1130],[T.cycle-.2,-100,22,520,1130],[T.cycle+1.2,-160,2,440,1080],[T.DUR,-150,2,440,1080]];
function camera(t){
  let i=0; while(i<CAMK.length-2 && t>CAMK[i+1][0]) i++;
  const a=CAMK[i], b=CAMK[i+1], k=eio(clamp((t-a[0])/Math.max(.001,b[0]-a[0])));
  let dl=b[1]-a[1]; if(dl>180) dl-=360; if(dl<-180) dl+=360;
  const c=[a[1]+dl*k, lerp(a[2],b[2],k), lerp(a[3],b[3],k), lerp(a[4],b[4],k)];
  c[0]+=Math.sin(t*.15)*1.2;
  c[2]*=lerp(.82,1,eo(P(t,0,1.2)));
  return c;
}

// ================= globe render =================
const cv=document.getElementById('c'), ctx=cv.getContext('2d');
const HR=2; // field resolution divider
let off=document.createElement('canvas'), octx=off.getContext('2d');
let cld=document.createElement('canvas'), cctx=cld.getContext('2d');

function fieldColor(v){ // v in [-1,1.2] -> [r,g,b,a]
  if(v>0.08){ // warm: yellow -> orange -> red, with contour banding
    let k=clamp((v-.08)/.9); k=clamp(k+.05*Math.sin(k*28));
    let c; if(k<.45){const q=k/.45; c=[255,lerp(214,140,q),lerp(70,40,q)]} else {const q=(k-.45)/.55; c=[lerp(255,226,q),lerp(140,44,q),lerp(40,24,q)]}
    return [c[0],c[1],c[2],clamp((v-.08)*3)*.92];
  } else if(v<-0.08){ let k=clamp((-v-.08)/.8); k=clamp(k+.05*Math.sin(k*28));
    return [lerp(120,40,k),lerp(220,110,k),255,clamp((-v-.08)*3)*.85];}
  return [0,0,0,0];
}

function drawGlobe(t,s,cam){
  const [lon0,lat0,R,cy]=cam, cx=540;
  const proj=d3.geoOrthographic().rotate([-lon0,-lat0]).translate([cx,cy]).scale(R).clipAngle(90).precision(.3);
  const path=d3.geoPath(proj,ctx);
  // ---- per-pixel ocean + warm-water field (half resolution) ----
  const x0=Math.max(0,Math.floor(cx-R)), x1=Math.min(1080,Math.ceil(cx+R)), y0=Math.max(0,Math.floor(cy-R)), y1=Math.min(1920,Math.ceil(cy+R));
  const W=Math.ceil((x1-x0)/HR), H=Math.ceil((y1-y0)/HR);
  off.width=W; off.height=H; cld.width=W; cld.height=H;
  const img=octx.createImageData(W,H), d=img.data, cimg=cctx.createImageData(W,H), cd=cimg.data;
  const sl0=Math.sin(lat0*D2R), cl0=Math.cos(lat0*D2R);
  const tt=t*.05;
  for(let j=0;j<H;j++){ const py=y0+j*HR+HR/2, yy=(cy-py)/R;
    for(let i=0;i<W;i++){ const px=x0+i*HR+HR/2, xx=(px-cx)/R; const rho2=xx*xx+yy*yy; const o=(j*W+i)*4;
      if(rho2>=1) continue;
      const rho=Math.sqrt(rho2), cz=Math.sqrt(1-rho2); // cos c
      let lat,lon;
      if(rho<1e-9){lat=lat0;lon=lon0}else{
        const sc=rho; lat=Math.asin(cz*sl0+yy*sc*cl0/rho)/D2R; lon=lon0+Math.atan2(xx*sc,rho*cz*cl0-yy*sc*sl0)/D2R;}
      const la=lat*D2R, lo=lon*D2R, X=Math.cos(la)*Math.cos(lo), Y=Math.cos(la)*Math.sin(lo), Z=Math.sin(la);
      // ocean base with limb darkening
      const sh=.35+.65*cz;
      let r=lerp(8,34,sh), g=lerp(30,96,sh), b=lerp(80,190,sh);
      // subtle ocean texture
      const n0=fbm(X*3+7,Y*3,Z*3); r+= (n0-.5)*10; g+=(n0-.5)*16; b+=(n0-.5)*22;
      // warm-water field
      let L=((lon%360)+360)%360;
      const nz=fbm(X*4+tt,Y*4-tt,Z*4+3.1);
      const dl=(L-s.Lc+(nz-.5)*26)/s.wid;
      const latW=11+(nz-.5)*10 + (L>200? (L-200)*.04:0);
      let v=s.amp*s.poolOn*Math.exp(-dl*dl*(dl>0?1:1.6))*Math.exp(-Math.pow((lat+ (nz-.5)*4)/latW,2));
      // cold upwelling patch off South America + La Niña cold tongue
      const dup=(L-278+(nz-.5)*10)/14; v-= s.upwell*.75*Math.exp(-dup*dup)*Math.exp(-Math.pow((lat+6+(nz-.5)*6)/10,2));
      const dlc=(L-235+(nz-.5)*20)/45; v-= s.cold*.9*Math.exp(-dlc*dlc)*Math.exp(-Math.pow(lat/(8+(nz-.5)*6),2));
      const fc=fieldColor(v);
      if(fc[3]>0){ const a=fc[3]*(.55+.45*cz); r=lerp(r,fc[0],a); g=lerp(g,fc[1],a); b=lerp(b,fc[2],a);}
      d[o]=r; d[o+1]=g; d[o+2]=b; d[o+3]=255;
      // clouds: background wisps + tropical convection cluster
      const cw=fbm(X*3.2+tt*2+11,Y*3.2,Z*3.2-tt*1.5);
      let ca=ss(.56,.78,cw)*.55*(.6+.4*Math.abs(Math.sin(la*2.2)));
      const dc=(L-s.cL+(cw-.5)*30)/28, cl=Math.exp(-dc*dc)*Math.exp(-Math.pow((lat-3+(cw-.5)*8)/11,2));
      const conv=s.cAmp*cl*ss(.32,.62,cw+cl*.25);
      ca=Math.max(ca,clamp(conv));
      if(ca>0.01){ const dk=s.cDark*clamp(conv*1.3); const cc=lerp(250,120,dk);
        cd[o]=cc; cd[o+1]=cc+2; cd[o+2]=cc+8; cd[o+3]=255*ca*(.55+.45*cz); }
    }}
  octx.putImageData(img,0,0); cctx.putImageData(cimg,0,0);
  // atmosphere glow
  const gl=ctx.createRadialGradient(cx,cy,R*.92,cx,cy,R*1.16);
  gl.addColorStop(0,s.heatGlobe>.01?`rgba(${Math.round(lerp(90,255,s.heatGlobe))},${Math.round(lerp(170,120,s.heatGlobe))},${Math.round(lerp(255,60,s.heatGlobe))},0.6)`:'rgba(90,170,255,0.55)'); gl.addColorStop(.35,'rgba(60,130,255,0.22)'); gl.addColorStop(1,'rgba(40,90,255,0)');
  ctx.fillStyle=gl; ctx.beginPath(); ctx.arc(cx,cy,R*1.16,0,7); ctx.fill();
  ctx.save(); ctx.beginPath(); ctx.arc(cx,cy,R,0,7); ctx.clip();
  ctx.imageSmoothingEnabled=true; ctx.drawImage(off,x0,y0,W*HR,H*HR);
  // graticule
  ctx.beginPath(); path(GRAT); ctx.strokeStyle='rgba(160,200,255,0.10)'; ctx.lineWidth=1.5; ctx.stroke();
  // land
  ctx.beginPath(); path(LAND);
  const lg=ctx.createLinearGradient(0,cy-R,0,cy+R); lg.addColorStop(0,'#6E9C5A'); lg.addColorStop(.5,'#8DAE63'); lg.addColorStop(1,'#B9A56C');
  ctx.fillStyle=lg; ctx.fill(); ctx.strokeStyle='rgba(20,40,30,.35)'; ctx.lineWidth=1.2; ctx.stroke();
  // global heat haze
  if(s.heatGlobe>.01){ ctx.save(); ctx.globalCompositeOperation='color'; ctx.fillStyle=`rgba(255,90,20,${.85*s.heatGlobe})`; ctx.fillRect(cx-R,cy-R,2*R,2*R);
    ctx.globalCompositeOperation='screen'; ctx.fillStyle=`rgba(140,40,0,${.6*s.heatGlobe})`; ctx.fillRect(cx-R,cy-R,2*R,2*R); ctx.restore();
    for(let i=0;i<22;i++){const ph=(t*.6+rnd(i+900))%1, x=cx-R*.8+rnd(i+910)*1.6*R, y=cy+R*.6-ph*R*1.2; ctx.strokeStyle=`rgba(255,210,140,${s.heatGlobe*.6*Math.sin(ph*Math.PI)})`; ctx.lineWidth=4;
      ctx.beginPath(); ctx.moveTo(x,y); ctx.quadraticCurveTo(x+12,y-16,x,y-32); ctx.quadraticCurveTo(x-12,y-48,x,y-64); ctx.stroke();} }
  if(s.hookRain>.01){ ctx.fillStyle=`rgba(40,110,255,${.25*s.hookRain})`; ctx.fillRect(cx-R,cy-R,2*R,2*R);
    for(let i=0;i<90;i++){const ph=(t*1.6+rnd(i+500))%1, x=cx-R+rnd(i+600)*2*R, y=cy-R+ (rnd(i+700)*1.2-.1+ph*.25)*2*R;
      ctx.strokeStyle=`rgba(180,220,255,${s.hookRain*.8*Math.sin(ph*Math.PI)})`; ctx.lineWidth=4; ctx.beginPath(); ctx.moveTo(x+8,y-34); ctx.lineTo(x,y); ctx.stroke();} }
  // equator (dashed)
  ctx.beginPath(); path({type:'LineString',coordinates:[[-180,0],[-90,0],[0,0],[90,0],[180,0]]});
  ctx.setLineDash([14,12]); ctx.strokeStyle='rgba(255,255,255,.55)'; ctx.lineWidth=2.5; ctx.stroke(); ctx.setLineDash([]);
  // clouds
  ctx.drawImage(cld,x0,y0,W*HR,H*HR);
  // evaporation wisps + rain inside globe
  drawEvapRain(t,s,proj,R);
  // trade winds
  drawWinds(t,s,proj,R);
  // fires
  
  // night/limb shading
  const sg=ctx.createRadialGradient(cx-R*.35,cy-R*.4,R*.1,cx,cy,R);
  sg.addColorStop(0,'rgba(255,255,255,0.10)'); sg.addColorStop(.6,'rgba(0,0,0,0)'); sg.addColorStop(1,'rgba(0,5,25,0.55)');
  ctx.fillStyle=sg; ctx.fillRect(cx-R,cy-R,2*R,2*R);
  ctx.restore();
  return proj;
}
function visible(proj,lon,lat){const r=proj.rotate();return d3.geoDistance([lon,lat],[-r[0],-r[1]])<Math.PI/2-.05}
function drawWinds(t,s,proj,R){
  const op=s.windOn*clamp(s.wind*1.1); if(op<=.02) return;
  const lats=[-15,-8,8,15], sc=R/470;
  ctx.lineCap='round'; ctx.lineJoin='round';
  lats.forEach((lat,li)=>{
    const spacing=26, speed=10*Math.max(.35,s.wind);
    for(let k=0;k<12;k++){
      let L=290-((t*speed+k*spacing+li*11)%(spacing*12));   // flows westward
      if(L<130) continue; const len=7+s.wind*5;
      const pts=[]; for(let q=0;q<=6;q++){const ll=L+len*(1-q/6); pts.push([ll>180?ll-360:ll,lat])}
      if(!visible(proj,pts[0][0],lat)||!visible(proj,pts[6][0],lat)) continue;
      const fade=ss(130,150,L)*ss(290,270,L);
      const P2=pts.map(p=>proj(p));
      ctx.strokeStyle=`rgba(235,245,255,${op*.9*fade})`; ctx.lineWidth=(2.5+s.wind*2.2)*sc;
      ctx.beginPath(); P2.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1])); ctx.stroke();
      const a=P2[6], b=P2[5], ang=Math.atan2(a[1]-b[1],a[0]-b[0]), hs=(8+s.wind*5)*sc;
      ctx.beginPath(); ctx.moveTo(a[0]-Math.cos(ang-.6)*hs,a[1]-Math.sin(ang-.6)*hs); ctx.lineTo(a[0],a[1]); ctx.lineTo(a[0]-Math.cos(ang+.6)*hs,a[1]-Math.sin(ang+.6)*hs); ctx.stroke();
    }});
}
function drawEvapRain(t,s,proj,R){
  const sc=R/470;
  if(s.evap>.02){ for(let i=0;i<14;i++){ const L=s.Lc-25+rnd(i)*50, lat=-8+rnd(i+40)*16; const lon=L>180?L-360:L;
      if(!visible(proj,lon,lat)) continue; const p=proj([lon,lat]); const ph=(t*.7+rnd(i+7))%1;
      ctx.strokeStyle=`rgba(255,225,200,${Math.min(1,s.evap)*Math.sin(ph*Math.PI)*.8})`; ctx.lineWidth=3*sc;
      ctx.beginPath(); const y=p[1]-ph*60*sc; ctx.moveTo(p[0],y); ctx.quadraticCurveTo(p[0]+8*sc,y-10*sc,p[0],y-20*sc); ctx.quadraticCurveTo(p[0]-8*sc,y-30*sc,p[0],y-40*sc); ctx.stroke(); }}
  const rain=Math.max(s.rain,s.hookRain*1.6);
  if(rain>.02){ const n=Math.round(30*Math.min(rain,1.6)); const cL=s.hookRain>.05?116:s.cL;
    for(let i=0;i<n;i++){ const L=cL-26+rnd(i+100)*52, lat=-9+rnd(i+200)*20, lon=L>180?L-360:L;
      if(!visible(proj,lon,lat)) continue; const p=proj([lon,lat]); const ph=(t*1.8+rnd(i+300))%1;
      ctx.strokeStyle=`rgba(150,210,255,${Math.min(1,rain)*.9*Math.sin(ph*Math.PI)})`; ctx.lineWidth=3*sc;
      ctx.beginPath(); ctx.moveTo(p[0]+4*sc,p[1]-30*sc+ph*30*sc); ctx.lineTo(p[0]-2*sc,p[1]-10*sc+ph*30*sc); ctx.stroke(); }}
}
function drawFires(t,a,proj,R){
  const spots=[[101.5,-0.5],[103.5,-2.8],[111.5,-1.5],[113.8,-2.3],[116,-0.5],[110.5,0.8]]; const sc=Math.max(.8,R/470);
  spots.forEach(([lo,la],i)=>{ if(!visible(proj,lo,la)) return; const p=proj([lo,la]);
    for(let k=0;k<3;k++){const ph=(t*.5+k/3+i*.17)%1; ctx.fillStyle=`rgba(90,85,95,${a*(1-ph)*.55})`;
      ctx.beginPath(); ctx.arc(p[0]+ph*30*sc,p[1]-ph*70*sc,(6+ph*18)*sc,0,7); ctx.fill();}
    const f=1+.18*Math.sin(t*15+i*2); const g=ctx.createRadialGradient(p[0],p[1],0,p[0],p[1],16*sc*f*a);
    g.addColorStop(0,'rgba(255,240,150,1)'); g.addColorStop(.4,'rgba(255,140,40,.95)'); g.addColorStop(1,'rgba(230,50,20,0)');
    ctx.fillStyle=g; ctx.beginPath(); ctx.arc(p[0],p[1],16*sc*f*a+.1,0,7); ctx.fill(); });
}

// ================= background =================
const STARS=[...Array(260)].map((_,i)=>[rnd(i)*1080,rnd(i+999)*1920,rnd(i+555)*1.8+.4,rnd(i+777)]);
function background(t){
  const g=ctx.createRadialGradient(540,1000,100,540,1000,1300); g.addColorStop(0,'#15275A'); g.addColorStop(.55,'#0A1636'); g.addColorStop(1,'#040916');
  ctx.fillStyle=g; ctx.fillRect(0,0,1080,1920);

// ================= phase meter (top) =================

  const xs=[300,540,780], lab=['NORMAL','EL NIÑO','LA NIÑA'], cs=[COL.ice,COL.warm,COL.cool];
  ctx.globalAlpha=op; ctx.strokeStyle='rgba(150,170,210,.35)'; ctx.lineWidth=5; ctx.beginPath(); ctx.moveTo(300,150); ctx.lineTo(780,150); ctx.stroke();
